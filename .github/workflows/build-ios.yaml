name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    env:
      BUILD_DIR: build_ios
      CONFIG: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 1

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Update Blender libraries
        run: |
          make update PLATFORM=ios_arm64

      - name: Verify iOS libraries
        run: |
          ls -lah lib
          ls -lah lib/ios_arm64

      - name: Configure iOS build
        run: |
          cmake \
            -S . \
            -B $BUILD_DIR \
            -G Xcode \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_IOS=ON \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_CYCLES=OFF \
            -DWITH_PYTHON=OFF \
            -DWITH_USD=OFF \
            -DWITH_ALEMBIC=OFF \
            -DWITH_OPENVDB=OFF \
            -DWITH_OPENIMAGEIO=OFF

      - name: Build Blender
        run: |
          cmake \
            --build $BUILD_DIR \
            --config Release \
            --target Blender \
            -- -parallelizeTargets

      - name: Find Blender app
        run: |
          find $BUILD_DIR -name "*.app" -print

      - name: Create IPA
        run: |
          APP=$(find $BUILD_DIR -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "No .app found"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -r Blender-iOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iOS
          path: Blender-iOS.ipa
